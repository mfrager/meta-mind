# Metamind module manifest.
#
# The `uri` is stable and path-derived: it follows this module's position in the
# repository, so moving the directory is the only thing that changes it and no
# other module may reuse the value.

[plugin]
name = "frame-activate"
uri = "https://metamind.dev/code/module/cognition/frame-activate"
version = "0.1.0"

[metadata]
category = "cognition"
owned_by_phase = 7
capability = "mm:FrameActivation"

[tbox.functions]
"cognition.frame_compose" = { source = "handlers::frame_compose" }
"cognition.frame_missing" = { source = "handlers::frame_missing" }
"cognition.frame_switch" = { source = "handlers::frame_switch" }

[monad.operations]
name = "cognition"
arity = 1

[build]
rust_edition = "2021"
