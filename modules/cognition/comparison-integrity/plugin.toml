# Metamind module manifest.
#
# The `uri` is stable and path-derived: it follows this module's position in the
# repository, so moving the directory is the only thing that changes it and no
# other module may reuse the value.
#
# The `name` is the directory name, as it is for every other module in the tree.
# The Phase 9 plan spells it `mm-comparison-integrity`; the registry's module
# identity is derived from the path, and a name that disagreed with the directory
# would be a second identity for one module, so the directory form wins.

[plugin]
name = "comparison-integrity"
uri = "https://metamind.dev/code/module/cognition/comparison-integrity"
version = "0.1.0"

[metadata]
category = "cognition"
owned_by_phase = 9
capability = "mm:ComparisonIntegrity"

[tbox.functions]
"cognition.compare_contract" = { source = "handlers::compare_contract" }

[monad.operations]
name = "cognition"
arity = 1

[build]
rust_edition = "2021"
