# Metamind module manifest.
#
# The `uri` is stable and path-derived: it follows this module's position in the
# repository, so moving the directory is the only thing that changes it and no
# other module may reuse the value.

[plugin]
name = "metacog"
uri = "https://metamind.dev/code/module/cognition/metacog"
version = "0.1.0"

[metadata]
category = "cognition"
owned_by_phase = 8
capability = "mm:CognitiveControl"

[tbox.functions]
"cognition.plan" = { source = "handlers::plan" }
"cognition.op_value" = { source = "handlers::op_value" }

[monad.operations]
name = "cognition"
arity = 1

[build]
rust_edition = "2021"
