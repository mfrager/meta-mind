# Metamind module manifest.
#
# The `uri` is stable and path-derived: it follows this module's position in the
# repository, so moving the directory is the only thing that changes it and no
# other module may reuse the value.

[plugin]
name = "library-query"
uri = "https://metamind.dev/code/module/cognition/library-query"
version = "0.1.0"

[metadata]
category = "cognition"
owned_by_phase = 7
capability = "mm:TechniqueSelection"

[tbox.functions]
"cognition.library_applicable" = { source = "handlers::library_applicable" }
"cognition.skill_retrieve" = { source = "handlers::skill_retrieve" }
"cognition.case_retrieve" = { source = "handlers::case_retrieve" }

[monad.operations]
name = "cognition"
arity = 1

[build]
rust_edition = "2021"
