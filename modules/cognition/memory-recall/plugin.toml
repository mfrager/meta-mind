# Metamind module manifest.
#
# The `uri` is stable and path-derived: it follows this module's position in the
# repository, so moving the directory is the only thing that changes it and no
# other module may reuse the value.

[plugin]
name = "memory-recall"
uri = "https://metamind.dev/code/module/cognition/memory-recall"
version = "0.1.0"

[metadata]
category = "cognition"
owned_by_phase = 5
capability = "mm:MemoryStore"

[tbox.functions]
"memory.remember" = { source = "handlers::remember" }
"memory.recall" = { source = "handlers::recall" }
"memory.consolidate" = { source = "handlers::consolidate" }
"memory.forget" = { source = "handlers::forget" }
"memory.mistakes" = { source = "handlers::mistakes" }
"memory.procedures" = { source = "handlers::procedures" }
"memory.summaries" = { source = "handlers::summaries" }

[monad.operations]
name = "cognition"
arity = 0

[build]
rust_edition = "2021"
