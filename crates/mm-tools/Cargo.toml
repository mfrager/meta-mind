[package]
name = "mm-tools"
description = "Metamind tool execution: MCP-shaped tool protocol, default-deny authorization, tiered sandbox capabilities, exactly-once action execution, and an append-only hash-chained action ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 10
capability = "mm:ToolExecution"

[lints]
workspace = true

[features]
default = []
# Tier 2 (syscall interception) and Tier 3 (microVM) lifecycles. Off by default
# because neither a gVisor runtime nor a Firecracker/E2B endpoint is installed on a
# developer machine; the lifecycle state machine and its tests are compiled either
# way, and only the runtime probe is gated.
gvisor = []
microvm = []

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-store-sqlite = { workspace = true }
mm-store-graph = { workspace = true }
mm-epistemic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The registry, the ledger, the idempotency journal, the observations and the snapshots
# are all projections this crate owns, and it reads and writes them through the same
# pool `mm-store-sqlite` hands out (`SqliteStore::pool`), the way `mm-eventlog` and
# `mm-being` do.
sqlx = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
oxrdf = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
