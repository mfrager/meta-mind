[package]
name = "mm-pi"
description = "Metamind's Pi code-agent client: LF-only JSONL framing, the id-correlated RPC protocol, the async client over the installed `pi` binary, and the session ingester that writes pi_sessions, pi_events and the /code graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 11
capability = "mm:PiCodeAgent"

[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-store-sqlite = { workspace = true }
mm-store-graph = { workspace = true }
# A session and its records are written row by row into `pi_sessions`/`pi_events`.
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
