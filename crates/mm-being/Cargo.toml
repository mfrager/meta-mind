[package]
name = "mm-being"
description = "Metamind being substrate: identity invariants, core blocks, personality, affect, user model, relationships, goals, and deterministic budgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 4
capability = "mm:BeingState"

[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
# Phase 6's deterministic observation-requirement predicate is the single source
# of truth for the "no assumption to observation" invariant (build step 13).
mm-epistemic = { workspace = true }
mm-store-sqlite = { workspace = true }
mm-store-graph = { workspace = true }
oxrdf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
