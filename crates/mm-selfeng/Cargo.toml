[package]
name = "mm-selfeng"
description = "Metamind self-engineering: typed change sets, a git-worktree sandbox, benchmark and shadow comparison, the deterministic promotion gate, rollback, the append-only evolution journal, and the four enforced budgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 11
capability = "mm:SelfEngineering"

[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-store-sqlite = { workspace = true }
# The budget ledger's debit is a single guarded UPDATE and the promotion row is an
# INSERT, so the crate speaks to the pool directly rather than through a wrapper.
sqlx = { workspace = true }
# A promotion updates the `/code` graph, so the change-set module reads the same
# graph store the Phase 2 scan writes.
mm-store-graph = { workspace = true }
# Reject rule 4 is Phase 9's hard prohibitions, asked through the firewall's own
# module rather than re-listed here.
mm-firewall = { workspace = true }
# The regression suite a candidate must not break is `mm-mistakes`' suite.
mm-mistakes = { workspace = true }
# A change set that came from Pi carries the ingested session that produced it.
mm-pi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
