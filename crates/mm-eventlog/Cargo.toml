[package]
name = "mm-eventlog"
description = "Metamind append-only bitemporal event log with deterministic replay and checkpointing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true


# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 1
capability = "mm:MmEventlog"
[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-store-sqlite = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
