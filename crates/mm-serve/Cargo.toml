[package]
name = "mm-serve"
description = "Metamind Web Console server: local HTTP + SSE surface over the kernel (design/planning/ui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true


# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest). The
# console is operator tooling alongside `mm-cli`; the UI plan
# (`design/planning/ui/`) is milestone-based and owns no kernel phase, so the
# foundation/operator phase (1) — the same one `mm-cli` declares — is the owner.
[package.metadata.metamind]
owned_by_phase = 1
capability = "mm:MmServe"
[lints]
workspace = true

[lib]
name = "mm_serve"
path = "src/lib.rs"

[[bin]]
name = "mm-serve"
path = "src/main.rs"

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-selfeng = { workspace = true }
mm-store-sqlite = { workspace = true }
mm-store-graph = { workspace = true }
mm-llm = { workspace = true }
mm-eventlog = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["env"] }
ulid = { workspace = true }
axum = "0.8"
ts-rs = "12"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
