[package]
name = "mm-log"
description = "Metamind structured logging: records, event codes, sinks, redaction, audit forwarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true


# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 1
capability = "mm:MmLog"
[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
