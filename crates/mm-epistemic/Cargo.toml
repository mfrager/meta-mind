[package]
name = "mm-epistemic"
description = "Metamind epistemic discipline: typed claims, a monotone promotion guard, a justification graph with dependency-directed retraction, explicit contradictions, and a validation barrier that is the only way into /world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 6
capability = "mm:EpistemicStore"

[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-store-sqlite = { workspace = true }
mm-store-graph = { workspace = true }
mm-eventlog = { workspace = true }
oxrdf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
