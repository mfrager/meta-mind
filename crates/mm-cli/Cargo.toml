[package]
name = "mm-cli"
description = "Metamind operator CLI: doctor, replay, graph validate, logs verify/tail/trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true


# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 1
capability = "mm:MmCli"
[lints]
workspace = true

[[bin]]
name = "mm-cli"
path = "src/main.rs"

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-codex = { workspace = true }
mm-store-sqlite = { workspace = true }
mm-store-graph = { workspace = true }
mm-eventlog = { workspace = true }
mm-llm = { workspace = true }
mm-being = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
