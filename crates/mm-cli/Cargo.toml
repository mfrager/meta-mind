[package]
name = "mm-cli"
description = "Metamind operator CLI: doctor, replay, graph validate, logs verify/tail/trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true


# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 1
capability = "mm:MmCli"
[lints]
workspace = true

[[bin]]
name = "mm-cli"
path = "src/main.rs"

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-codex = { workspace = true }
mm-store-sqlite = { workspace = true }
mm-store-graph = { workspace = true }
mm-eventlog = { workspace = true }
mm-llm = { workspace = true }
mm-being = { workspace = true }
mm-memory = { workspace = true }
mm-epistemic = { workspace = true }
mm-library = { workspace = true }
mm-metacog = { workspace = true }
mm-decision = { workspace = true }
mm-firewall = { workspace = true }
mm-tools = { workspace = true }
# Phase 11's four organs, driven through the same entry points the loop uses: the
# prediction ledger and calibration, the mistake compiler, the promotion pipeline, and
# the Pi session ingester.
mm-metaanalysis = { workspace = true }
mm-mistakes = { workspace = true }
mm-selfeng = { workspace = true }
mm-pi = { workspace = true }
# Phase 12's autonomy layer, driven through the same controller the `mm-loop` background
# process runs: `loop`, `self-model`, `debt`, `gc`, `module` and `design` are all reads or
# writes of the tables `0012_loop.sql` declares, and none of them re-implements a stage.
mm-runtime = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# `action show` reads the `tool_calls` and `observed_payloads` projections through the
# same pool `mm-store-sqlite` hands out, the way `mm-eventlog` and `mm-being` do.
sqlx = { workspace = true }
# `memory eval` grades against a throwaway store, so it needs a temporary
# directory in normal operation, not only under test.
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
