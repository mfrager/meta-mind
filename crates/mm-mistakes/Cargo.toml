[package]
name = "mm-mistakes"
description = "Metamind mistake-to-regression-test compiler: minimize a recorded incident, emit a test and its fixture into bench/regression, and assert the fail-before/pass-after pair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 11
capability = "mm:MistakeRegression"

[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
mm-store-sqlite = { workspace = true }
# A mistake is a Phase 5 memory of kind `mistake`; the compiler reads the organ's
# own records rather than a second copy of them.
mm-memory = { workspace = true }
# The generated case is recorded in `regression_tests` with an upsert on `path`.
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
