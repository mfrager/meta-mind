[package]
name = "mm-firewall"
description = "Metamind sanity firewall: deterministic prohibition rails, bounded judgments, uncertainty/calibration pressure, and one precedence-ordered outcome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 9
capability = "mm:SanityFirewall"

[lints]
workspace = true

[dependencies]
mm-core = { workspace = true }
mm-log = { workspace = true }
# The firewall's judgments are bounded decisions, so it programs against the
# decision primitive rather than against a model.
mm-decision = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
