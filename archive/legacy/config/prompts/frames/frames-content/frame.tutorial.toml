schema = "mm.frame.template.v1"
id = "frame.tutorial"
version = 1
kind = "tutorial"
step = "walkthrough"
strategy = "cm.frame.v1"
text = "Walk through one tutorial step, then wait. Frame {{frame_kind}} at {{frame_step}}."
slots = ["frame_kind", "frame_step"]
[transitions]
work = "frame.work"
goodbye = "frame.goodbye"
[utterance]
delay_ms = 4500
jitter = 0.2
max_attempts = 2
backoff = 3
