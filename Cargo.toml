[workspace]
resolver = "2"
exclude = ["archive/**"]
members = [
    "crates/mm-core",
    "crates/mm-prompt",
    "crates/mm-llm",
    "crates/mm-agentstream",
    "crates/mm-cme",
    "crates/mm-serve",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "private"
publish = false

[workspace.dependencies]
# --- shared async/runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util", "io-std"] }
futures = "0.3"
tracing = "0.1"

# --- serialization / errors ---
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
async-trait = "0.1"

# --- identity / hashing ---
ulid = { version = "2", features = ["serde"] }
sha2 = "0.10"

# --- config + CLI ---
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
ts-rs = { version = "12", features = ["serde-json-impl"] }

# --- Metamind crates ---
mm-core = { path = "crates/mm-core" }
mm-prompt = { path = "crates/mm-prompt" }
mm-llm = { path = "crates/mm-llm" }
mm-agentstream = { path = "crates/mm-agentstream" }
mm-cme = { path = "crates/mm-cme" }

# --- dev ---
proptest = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
