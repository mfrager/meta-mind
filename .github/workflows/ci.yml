name: ci

# The Phase 1 pass gate (§8 of the foundation build plan) as CI. Everything here
# is a plain command that a human can run locally: build, clippy, tests, then the
# four operator commands from the gate.

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: phase-1 gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Oxigraph is built with the `rocksdb-pkg-config` feature, so the build needs
      # a system RocksDB that pkg-config can find (§9 risk: RocksDB build failure).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libsqlite3-dev librocksdb-dev

      # Reads the pinned channel and components from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      # `zero warnings`: clippy with -D warnings is the workspace's warning gate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

      - name: Tests
        run: cargo test --workspace

      - name: Kernel gates
        run: |
          cargo run -p mm-cli -- doctor
          cargo run -p mm-cli -- graph validate --graph being
          cargo run -p mm-cli -- logs verify
          cargo run -p mm-cli -- replay --from 0

      # Phase 12's scenario, which the `Tests` step above already asserts as an e2e test
      # (`tests/e2e/phase12_autonomy.rs`): a novel goal drives the loop to a promoted,
      # hot-loaded capability with no human edit, the run replays byte-identically from its
      # own events, the debt sweep collects nothing protected, and the audit chain verifies
      # over all of it. Running it here as well is what makes the gate readable as commands
      # in the workflow, not only as a test name.
      - name: Phase 12 gate
        run: |
          DATA=$(mktemp -d)
          cargo run -p mm-cli -- --data-dir "$DATA" doctor
          RUN=$(cargo run -p mm-cli -- --data-dir "$DATA" loop run \
            --goal-file bench/qualification/goal_novel.json \
            --budget-file bench/qualification/budget.toml --novel --json | jq -r .run_id)
          cargo run -p mm-cli -- --data-dir "$DATA" loop status --run "$RUN"
          cargo run -p mm-cli -- --data-dir "$DATA" loop artifacts --run "$RUN"
          cargo run -p mm-cli -- --data-dir "$DATA" loop replay --run "$RUN"
          cargo run -p mm-cli -- --data-dir "$DATA" self-model report --run "$RUN"
          cargo run -p mm-cli -- --data-dir "$DATA" debt scan
          cargo run -p mm-cli -- --data-dir "$DATA" gc --apply
          cargo run -p mm-cli -- --data-dir "$DATA" module load \
            --uri "https://metamind.dev/code/module/cognition/goal-attainment@0.1.0"
          cargo run -p mm-cli -- --data-dir "$DATA" codex verify
          cargo run -p mm-cli -- --data-dir "$DATA" being verify
          cargo run -p mm-cli -- --data-dir "$DATA" logs verify

      # The loop as a supervised process: readiness on stdout, a run to a completed
      # promotion, and the clocks ticked without Identity ever firing during a run.
      - name: Loop background process
        run: |
          DATA=$(mktemp -d)
          cargo run -p mm-runtime --bin mm-loop -- --data-dir "$DATA" \
            --goal-file bench/qualification/goal_novel.json \
            --budget-file bench/qualification/budget.toml --assert-completed --ticks 3
          cargo run -p mm-cli -- --data-dir "$DATA" logs verify
