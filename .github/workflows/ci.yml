name: ci

# The kept core only: six Rust crates, the generated wire contract, and the
# single frontend workspace. Archived crates, routes, and tests are excluded.

on:
  push:
    branches: [slim, master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang python3 ripgrep

      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Workspace is core-only
        run: ./scripts/check-core-only.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Generated wire types are current
        run: |
          cargo test -p mm-serve export_agentstream_bindings
          git diff --exit-code frontend/src/lib/wire

  console:
    name: console
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
