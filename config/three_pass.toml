# Three-pass turn configuration. Reviewed data: prompts and backends are named,
# never embedded in code. Missing keys use the defaults in mm-cme::config.

[interpret]
budget_class = "quick"
strategy = "cm.interpret.v1"
max_checks = 8
max_tokens = 2048
temperature = 0.0

[process]
budget_class = "standard"
strategy = "cm.process.v1"
max_tokens = 4096
temperature = 0.2

[verify]
budget_class = "quick"
strategy = "cm.verify.v1"
max_retries = 5
check_timeout_ms = 20000
max_parallel_checks = 4
allow_override = false
max_tokens = 2048
temperature = 0.0

[budget]
# Token and wall limits are off by default; rounds are always capped.
enabled = false

[envelope]
max_tokens = 184000

[verification.backends.llm_judge]
enabled = true
temperature = 0.0
max_output_tokens = 512
