schema = "mm.prompt.fragment.v1"
id = "process_execution"
version = 2
text = """
[TASK] {{process_task}}
[CONSTRAINTS]
{{process_constraints}}
[TOOLS] {{process_suggested_tools}}
[BUDGET] {{budget_class}} — {{budget_rounds}} rounds, {{budget_tokens}} tokens, {{budget_wall_ms}} ms remaining
Complete the task and produce the final user-facing reply. Use the conversation tools only to keep
the state true; there is no external or durable side effect to perform. If verification rejected an
earlier attempt, address the stated failure directly.
"""
