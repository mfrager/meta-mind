# Omitted from the copy: `src/bin/` (the origin workspace's example generators),
# `tests/` and the in-src `*_tests.rs` suites, which depend on the wider
# `rust_symbolic` workspace. Metamind exercises the surface it depends on
# (canonical N-Triples + content hash + Turtle parse) from `mm-store-graph`.
[package]
name = "rdf-codec"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chumsky = "0.13"
math-core = { path = "../math-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ryu = "1"
ulid = "2"

# Owned-by metadata the Phase 2 code scanner reads (mm-codex::manifest).
[package.metadata.metamind]
owned_by_phase = 1
capability = "mm:RdfCodec"
origin = "rust_symbolic"
copied_from = "https://github.com/mfrager/blanc-scripts@c03aee5fb3a9947da1c7f21e491aa52f43d6f09d"
license = "unspecified"

# Vendored code is not held to Metamind's zero-warning bar; only `mm-*` crates are.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "allow", priority = -1 }
